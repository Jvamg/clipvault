[package]
name = "clipvault"
version = "0.1.0"
edition = "2021"
authors = ["João Vitor Araujo Moraes Guzzo"]
description = "Gerenciador e Time-Machine inteligente de clipboard para Linux (Wayland e X11)"
readme = "README.md"
license = "MIT"
repository = "https://github.com/Jvamg/clipvault"
homepage = "https://github.com/Jvamg/clipvault"
keywords = ["clipboard", "tui", "wayland", "linux", "security"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
arboard = "3.4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "5.0"
fuzzy-matcher = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ratatui = "0.28"
ratatui-image = "2.0"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.10"

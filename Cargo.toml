[package]
name = "clipvault"
version = "0.1.0"
edition = "2021"
description = "Gerenciador e Time-Machine inteligente de clipboard para Linux (X11)"

[dependencies]
anyhow = "1.0"
arboard = "3.4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "5.0"
fuzzy-matcher = "0.3"
hex = "0.4"
ratatui = "0.28"
redb = "2.1"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.10"
